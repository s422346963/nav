<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路标导航</title>
    <meta name="description" content="路标导航是一个轻量、免费、开源的导航网站：左侧分类导航 + 右侧卡片内容区，支持多引擎搜索与后台可视化管理。" />
    <meta name="keywords" content="路标导航,WayNav,导航网站,网址导航,书签管理" />
    <meta name="author" content="Bin" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />
    <meta name="renderer" content="webkit" />
    <style>
      /* 全屏启动遮罩（参考 WebStack 主题的 ball-pulse 加载动画） */
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loading {
          background: #18181b;
        }
      }
      .boot-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        object-fit: contain;
      }
      .boot-dots {
        display: flex;
        gap: 8px;
      }
      .boot-dots > div {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #177ddc;
        animation: boot-pulse 1s infinite ease-in-out;
      }
      .boot-dots > div:nth-child(2) {
        animation-delay: 0.2s;
      }
      .boot-dots > div:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes boot-pulse {
        0%,
        60%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        30% {
          opacity: 0.1;
          transform: scale(0.01);
        }
      }
      .boot-text {
        font-size: 14px;
        color: #71717a;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loading">
        <img class="boot-logo" src="https://cdn.jsdelivr.net/gh/s422346963/public@image/1782285957518.ico" alt="" />
        <div class="boot-dots"><div></div><div></div><div></div></div>
        <div class="boot-text">加 载 中</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
